    -webkit-tap-highlight-color:transparent;
  }
  .app{max-width:480px;margin:0 auto;padding:20px 16px 40px;}

  /* Header */
  header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px;}
  .brand-title{font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:22px;letter-spacing:-0.5px;margin:0;}
  .brand-sub{font-size:12.5px;color:var(--gray);margin-top:3px;}
  .lock-btn{
    border:1px solid var(--line);background:var(--card);border-radius:10px;
    width:38px;height:38px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;flex-shrink:0;transition:background .15s;
  }
  .lock-btn:active{background:var(--tab-idle);}
  .admin-bar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--pink);color:#fff;border-radius:12px;padding:10px 14px;
    margin-bottom:16px;font-size:13px;font-weight:600;
  }
  .admin-bar button{
    background:rgba(255,255,255,.22);border:none;color:#fff;font-size:12.5px;
    padding:6px 10px;border-radius:8px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .admin-links{display:flex;gap:6px;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:0;position:relative;z-index:1;}
  .tab{
    flex:1;background:var(--tab-idle);border:1px solid var(--line);border-bottom:none;
    border-radius:12px 12px 0 0;padding:10px 4px 12px;text-align:center;cursor:pointer;
    transition:transform .15s, background .15s, color .15s;color:var(--gray);
    transform:translateY(6px);
  }
  .tab .num{display:block;font-size:10.5px;font-weight:700;letter-spacing:1px;opacity:.7;margin-bottom:2px;}
  .tab .lbl{display:block;font-size:13px;font-weight:700;line-height:1.25;}
  .tab.active{
    background:var(--card);color:var(--ink);transform:translateY(0);
    border-color:var(--pink);box-shadow:0 -2px 0 var(--pink) inset;
  }
  .tab.active .num{color:var(--pink-deep);opacity:1;}

  /* Content card */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:0 12px 12px 12px;
    padding:20px 18px 22px;min-height:280px;position:relative;
  }
  .card-title{font-family:'Nanum Myeongjo',serif;font-weight:700;font-size:17px;margin:0 0 4px;}
  .updated{font-size:11.5px;color:var(--gray);margin-bottom:14px;}
  .body-text{animation:fadeSlide .28s ease;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .body-text h3{font-size:14.5px;color:var(--pink-deep);margin:16px 0 6px;font-weight:700;}
  .body-text h3:first-child{margin-top:0;}
  .body-text p{font-size:14.5px;line-height:1.65;margin:0 0 10px;}
  .body-text ul{margin:0 0 10px;padding-left:18px;}
  .body-text li{font-size:14.5px;line-height:1.6;margin-bottom:4px;}
  .empty-state{color:var(--gray);font-size:14px;line-height:1.6;padding:20px 0;}

  textarea.editor{
    width:100%;min-height:260px;border:1px solid var(--line);border-radius:10px;
    padding:12px;font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.6;
    resize:vertical;background:#FBFAFA;color:var(--ink);
  }
  .editor-hint{font-size:11.5px;color:var(--gray);margin:8px 0 14px;line-height:1.5;}
  .save-row{display:flex;gap:8px;}
  .save-btn{
    flex:1;background:var(--pink);color:#fff;border:none;border-radius:10px;
    padding:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;
  }
  .save-btn:active{background:var(--pink-deep);}

  .loading{padding:60px 0;text-align:center;color:var(--gray);font-size:13.5px;}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(42,38,38,.45);display:flex;
    align-items:center;justify-content:center;padding:24px;z-index:20;
  }
  .modal{
    background:#fff;border-radius:14px;padding:22px 20px;width:100%;max-width:320px;
  }
  .modal h2{font-size:16px;margin:0 0 6px;font-family:'Nanum Myeongjo',serif;}
  .modal p{font-size:12.5px;color:var(--gray);margin:0 0 14px;line-height:1.5;}
  .modal input{
    width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    font-size:14px;margin-bottom:10px;font-family:inherit;
  }
  .modal-row{display:flex;gap:8px;margin-top:6px;}
  .modal-row button{
    flex:1;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:13.5px;
    cursor:pointer;font-family:inherit;
  }
  .btn-cancel{background:var(--tab-idle);color:var(--ink);}
  .btn-confirm{background:var(--pink);color:#fff;}
  .modal-error{color:var(--pink-deep);font-size:12px;margin:-4px 0 8px;min-height:14px;}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:24px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:30;
  }
  .toast.show{opacity:1;}

  /* Search */
  .search-wrap{
    position:relative;display:flex;align-items:center;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-bottom:14px;
  }
  .search-wrap svg{flex-shrink:0;}
  .search-wrap input{
    flex:1;border:none;outline:none;background:transparent;font-family:inherit;
    font-size:14px;padding:11px 8px;color:var(--ink);
  }
  .search-wrap input::placeholder{color:#B3ABAC;}
  .search-clear{
    border:none;background:var(--tab-idle);color:var(--gray);width:22px;height:22px;
    border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0;line-height:1;
  }

  .results-list{display:flex;flex-direction:column;gap:8px;}
  .result-item{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;
  }
  .result-item:active{background:var(--tab-idle);}
  .result-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap;}
  .result-badge{
    background:var(--pink);color:#fff;font-size:10.5px;font-weight:700;
    padding:3px 8px;border-radius:20px;flex-shrink:0;
  }
  .result-heading{font-size:12px;color:var(--pink-deep);font-weight:700;}
  .result-snippet{font-size:13.5px;line-height:1.55;margin:0;color:var(--ink);}
  .result-snippet mark{background:#FBDCE1;color:var(--pink-deep);padding:0 2px;border-radius:3px;font-weight:700;}
  .results-empty{color:var(--gray);font-size:13.5px;text-align:center;padding:40px 10px;line-height:1.6;}

  .content-block{border-radius:8px;transition:background-color .3s;padding:2px 6px;margin:0 -6px;}
  .content-block.flash{background-color:#FBDCE1;}
  .body-text p.flash, .body-text li.flash, .body-text h3.flash{
    background-color:#FBDCE1;border-radius:6px;transition:background-color .3s;
    padding:2px 6px;margin-left:-6px;margin-right:-6px;
  }
  .body-text li.flash{margin-left:0;padding-left:2px;}

  .result-overlay{
    position:fixed;inset:0;background:rgba(42,38,38,.5);display:flex;
    align-items:flex-end;justify-content:center;z-index:25;
  }
  .result-modal{
    background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:480px;
    max-height:82vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);
  }
  .result-modal-head{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:16px 16px 12px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .result-modal-head .badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .result-modal-close{
    border:none;background:var(--tab-idle);color:var(--gray);width:28px;height:28px;
    border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;line-height:1;
  }
  .result-modal-body{padding:14px 16px 22px;overflow-y:auto;}
  .result-modal-body h3{font-size:15px;color:var(--pink-deep);margin:14px 0 6px;font-weight:700;}
  .result-modal-body h3:first-child{margin-top:0;}
  .result-modal-body p{font-size:14.5px;line-height:1.65;margin:0 0 10px;}
  .result-modal-body ul{margin:0 0 10px;padding-left:18px;}
  .result-modal-body li{font-size:14.5px;line-height:1.6;margin-bottom:4px;}
  .result-modal-body mark{background:#FBDCE1;color:var(--pink-deep);padding:0 2px;border-radius:3px;font-weight:700;}
  .result-modal-body .modal-hit{background:#FDEFEF;border-radius:6px;padding:4px 8px;margin-left:-8px;margin-right:-8px;}
  .result-modal-body .modal-hit.hit-li{margin-left:0;}
  .result-modal-body figure.ref-img{margin:6px 0 18px;}
  .result-modal-body figure.ref-img img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;}
  .result-modal-body figure.ref-img figcaption{font-size:11px;color:var(--gray);margin-top:6px;text-align:center;}

  .ref-img{margin:6px 0 20px;}
  .ref-img img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;}
  .ref-img figcaption{font-size:11px;color:var(--gray);margin-top:6px;text-align:center;}
</style>
</head>

처방대로가 원칙, 환부는 심장보다 높게 유지(수술 후 발생 가능한 부종 예방)
- ENT, DN, OS: head up 30도 유지, order 있으면 order대로
- 가슴 위: Head-up 30° 유지 / 팔: Pillow 2개 제공 / 다리: Elevation pillow 또는 침상 다리 쪽 높이기

## 7. 가글 교육
- [DICLOG] 디클로메드액 0.074% 가글 - 수시로, 삼키지 않도록, 금식 중에도 가능, S/A 수술하면 반납함
- [CHXG1] 헥사메딘액 0.012% 가글(필요시): 처방에 따라 하루 1~2회

## 8. DVT pump 교육
- 최소 2시간 이상 필요 - 필요성 설명
- 사이즈 재확인 - 너무 크지 않게
- **임의로 끄지 않도록 - 혈전 예방**
- 항색전 스타킹 착용(처방 시): SC 환자 - 양쪽 다 신고 옴/DVT 바로 시행, 유제현 교수님 환자 - 환측·건측 모두 신고 옴/immobilizer 제거 후 DVT 바로 시행

## 9. PCA 교육
- 자가 조절법 설명(교육자료 참고)
- Clamping 사용법 안내(오심·어지러움 시 주입 중단 가능)
- PCA 중에도 통증 - 추가 투약 가능
- Wound PCA vs IV PCA: 경로(국소 침윤/정맥 내 전신), 약물(Ropivacaine 등/Fentanyl·Ketorolac·Ramosetron), 기전(말초 통각 수용체 차단/중추 opioid 수용체 작용), 전신 부작용(적음/오심·어지러움·호흡억제), 제거(카테터 제거/IV line 분리)
- IV PCA 세부: 2cc/hr 지속 주입, 1회 pump 시 0.5cc bolus, 15~20분 휴약 시간

## 10. 처방 약 투여
- 수액 처방대로 연결
- 항생제 시간 확인 - CI 대상자는 수술실에서 이미 투여
- 다음 투여 시간 확인·약 깍지 만들기
- SC환자 주의: 김석우 교수님 - [IDX2] 4A+[IFAMO20] 1V+[INS1P2] 1B mixed fluid(over 4hr)는 주치의 확인 후 투여([IDX2]는 IV로 시작했다가 po로 바꾸어 Tapering함) / 문봉수·장석인 교수님 - [IDX2] 2A+[IFAMO20] 1V+[INS1P2] 1B mixed fluid(over 1hr) IV12hr는 주치의 확인 후 투여(Tapering 안함)

## 11. Lab
- SAVE 부위 재확인
- PDA 사용하여 환자확인 후 시행

## 12. Nebulizer
- Nebulizer 실시(처방 시): G/A 후 객담 배출·EDBC와 함께, nebulizer 정규 9/2/8 or 6/11/5/9 → post op는 시간 맞춰 돌림
- Aerojessica 사용 격려(처방시)

## 13. 환부·배액관 관찰
- 수술 부위 oozing 확인(드레싱 관통 여부·시간 기록)
- 환부 울혈·부종
- 배액관 확인 및 기록(종류·개수·음압·성상)
- H-vac, JP 한 번 비우기 - 양 기록(SC는 TID count/나머진 mx 확인)
- CMS 손상 여부
- IV cath. 삽입부 종창·발적

## 14. 마무리
- 자가배뇨 격려
- 안 쓴 약 - 처방 D/C
- 사용분 - #(op)로 표기
- 투약 기록 사인
- 간호 기록
- SC환자 sitting여부는 반드시 주치의 확인 후 시행(대부분 익일 주치의 확인 후 시행)

## 간호 기록 기록 시 고려 사항
- 기록 체크포인트: 어떤 마취하에 어떤 수술을 받았는가 / 어떤 보조기를 하고 왔는가 / 배액관 종류와 상태는 어떤가 / 환부 울혈은 있는가 / PCA 유무 및 사용법이 설명되었는가 / 제한되는 자세가 설명되었는가 / 처치와 주의사항을 설명했는가 / CMS 손상은 없는가(말초·중추 신경계 수술 시) / 의식수준·지남력 확인(G/A 후 자도되나, 불러서 깨는지 주기적으로 확인해야함) / V/S 확인하였는가 / 환자 상태 및 특이 요구사항 / 통증 정도 및 조절 노력
- 투약 기록: 수술 전 투약 약물 모두 사인 / 2회 이상 투여 약물은 다음 예정시간까지 표기 / Prepare 약물은 수술 전에 사인하지 않음 / CI 대상 수술은 @로 표기(기존 투여 항생제는 평가 대상 제외)

## RED FLAG - 즉시 보고
- **공통**: 드레싱 주변에서 흘러나오는 출혈, 조절 안 되는 통증(NRS 8 이상), V/S 불안정·빈맥 후 저혈압, 의식 수준 변화, SpO2 하강·호흡곤란
- **보조기·사지**: 손·발가락 저림·창백·냉감(보조기 압박 가능성), CMS 손상 소견
- **배액관**: 갑작스러운 배액량 증가, 선홍색 다량 배액, 음압 유지 안 됨
- **마취·PCA**: S/A 후 하지 감각 회복 지연, Block 후 호흡곤란(횡격막 마비/기흉 가능성), PCA 후 과도한 진정·호흡억제(불러도 안깨는 과진정일 때)

## (부록) 보조기
- 이용범, 노규철 교수님 / C-sling: 쇄골 골절이나 견봉성형술 시행 환자에게 주로 적용
- 노규철 교수님 / K-sling(L-sling=Ultra sling): 회전근개봉합술이나 Bankart 수술시행 환자에게 주로 적용
- 이용범 교수님 / L-brace: 회전근개봉합술이나 Bankart 수술시행 환자에게 주로 적용(착용방법 숙지할 것)`;

const LAST_UPDATED = '2026-08-28T00:00:00.000Z';

function seedContent(){
  return {
    admission: {body: ADMISSION_TEXT, updatedAt: LAST_UPDATED},
    preop: {body: PREOP_TEXT, updatedAt: LAST_UPDATED},
    postop: {body: POSTOP_TEXT, updatedAt: LAST_UPDATED}
  };
}

function init(){
  state.content = seedContent();
  state.loading = false;
  renderShell();
  renderDynamic();
}

function escapeHtml(str){
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function boldify(s){
  return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
}

// Parse markdown-ish text into blocks: each block starts at a "## " heading
// (or is a headless intro block) and holds its raw (already-escaped) lines.
function parseBlocks(sectionId, text){
  if(!text || !text.trim()) return [];
  const lines = escapeHtml(text).split('\n');
  let blocks = [];
  let current = null;
  let idx = 0;
  lines.forEach(raw => {
    const line = raw.trim();
    if(line.startsWith('## ')){
      idx++;
      current = {heading: line.slice(3), lines: [], id: `block-${sectionId}-${idx}`};
      blocks.push(current);
    } else if(line !== ''){
      if(!current){
        idx++;
        current = {heading: null, lines: [], id: `block-${sectionId}-${idx}`};
        blocks.push(current);
      }
      current.lines.push(line);
    }
  });
  return blocks;
}

function blockLinesToHtml(blockId, lines){
  let html = '';
  let inList = false;
  const closeList = () => { if(inList){ html += '</ul>'; inList = false; } };
  lines.forEach((line, i) => {
    const lineId = `${blockId}-l${i}`;
    if(line.startsWith('- ')){
      if(!inList){ html += '<ul>'; inList = true; }
      html += `<li id="${lineId}">${boldify(line.slice(2))}</li>`;
    } else {
      closeList();
      html += `<p id="${lineId}">${boldify(line)}</p>`;
    }
  });
  closeList();
  return html;
}

function renderSectionHtml(sectionId, body){
  const blocks = parseBlocks(sectionId, body);
  if(blocks.length === 0) return '';
  const refs = SECTION_REF_IMAGES[sectionId] || [];
  return blocks.map(b => {
    const headingHtml = b.heading ? `<h3 id="${b.id}-h">${boldify(b.heading)}</h3>` : '';
    let html = `<div class="content-block" id="${b.id}">${headingHtml}${blockLinesToHtml(b.id, b.lines)}</div>`;
    const match = refs.find(r => r.after === b.heading);
    if(match){
      match.images.forEach(imgDef => {
        html += `<figure class="ref-img"><img src="${REF_IMAGES[imgDef.key]}" alt="${imgDef.caption}" loading="lazy"><figcaption>${imgDef.caption}</figcaption></figure>`;
      });
    }
    return html;
  }).join('');
}

function snippetPlain(line){
  let s = line.startsWith('- ') ? line.slice(2) : line;
  return s.replace(/\*\*(.+?)\*\*/g, '$1');
}

function highlightMatch(text, q){
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx < 0) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + q.length) + '</mark>' + text.slice(idx + q.length);
}

function searchManual(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  let results = [];
  SECTIONS.forEach(sec => {
    const body = (state.content[sec.id] && state.content[sec.id].body) || '';
    const blocks = parseBlocks(sec.id, body);
    blocks.forEach(b => {
      let matchedInLines = false;
      b.lines.forEach((line, i) => {
        if(line.toLowerCase().includes(q)){
          matchedInLines = true;
          results.push({sectionId: sec.id, sectionLabel: sec.label, targetId: `${b.id}-l${i}`, heading: b.heading, text: line});
        }
      });
      if(!matchedInLines && b.heading && b.heading.toLowerCase().includes(q)){
        results.push({sectionId: sec.id, sectionLabel: sec.label, targetId: `${b.id}-h`, heading: b.heading, text: b.heading});
      }
    });
  });
  return results.slice(0, 40);
}

function onSearchInput(val){
  state.searchQuery = val;
  syncSearchClearBtn();
  renderDynamic();
}
function clearSearch(){
  state.searchQuery = '';
  const si = document.getElementById('search-input');
  if(si){ si.value = ''; si.focus(); }
  syncSearchClearBtn();
  renderDynamic();
}
function syncSearchClearBtn(){
  const btn = document.getElementById('search-clear-btn');
  if(btn) btn.style.display = state.searchQuery ? '' : 'none';
}
function openResultModal(sectionId, targetId){
  const blockId = targetId.replace(/-(l\d+|h)$/, '');
  state.modal = {sectionId, blockId, targetId, query: state.searchQuery};
  renderDynamic();
}
function closeResultModal(){
  state.modal = null;
  renderDynamic();
}
function lineToHtml(line, query){
  const s = query ? highlightMatch(line, query) : line;
  return boldify(s);
}
function renderModalHtml(){
  const m = state.modal;
  if(!m) return '';
  const sectionInfo = SECTIONS.find(s => s.id === m.sectionId);
  const body = (state.content[m.sectionId] && state.content[m.sectionId].body) || '';
  const blocks = parseBlocks(m.sectionId, body);
  const block = blocks.find(b => b.id === m.blockId);
  if(!block){
    return `
      <div class="result-overlay" onclick="if(event.target===this)closeResultModal()">
        <div class="result-modal">
          <div class="result-modal-head">
            <span class="result-badge">${sectionInfo.label}</span>
            <button class="result-modal-close" onclick="closeResultModal()" aria-label="닫기">✕</button>
          </div>
          <div class="result-modal-body"><p>내용을 찾을 수 없습니다.</p></div>
        </div>
      </div>
    `;
  }
  const hitMatch = m.targetId.match(/-l(\d+)$/);
  const hitLineIndex = hitMatch ? Number(hitMatch[1]) : null;
  const hitIsHeading = m.targetId.endsWith('-h');

  let bodyHtml = '';
  if(block.heading){
    const headingHtml = lineToHtml(block.heading, m.query);
    bodyHtml += hitIsHeading
      ? `<h3 class="modal-hit">${headingHtml}</h3>`
      : `<h3>${headingHtml}</h3>`;
  }
  let inList = false;
  const closeList = () => { if(inList){ bodyHtml += '</ul>'; inList = false; } };
  block.lines.forEach((line, i) => {
    const isHit = hitLineIndex === i;
    if(line.startsWith('- ')){
      if(!inList){ bodyHtml += '<ul>'; inList = true; }
      bodyHtml += `<li class="${isHit ? 'modal-hit hit-li' : ''}">${lineToHtml(line.slice(2), m.query)}</li>`;
    } else {
      closeList();
      bodyHtml += `<p class="${isHit ? 'modal-hit' : ''}">${lineToHtml(line, m.query)}</p>`;
    }
  });
  closeList();

  const refs = SECTION_REF_IMAGES[m.sectionId] || [];
  const imgMatch = refs.find(r => r.after === block.heading);
  if(imgMatch){
    imgMatch.images.forEach(imgDef => {
      bodyHtml += `<figure class="ref-img"><img src="${REF_IMAGES[imgDef.key]}" alt="${imgDef.caption}" loading="lazy"><figcaption>${imgDef.caption}</figcaption></figure>`;
    });
  }

  return `
    <div class="result-overlay" onclick="if(event.target===this)closeResultModal()">
      <div class="result-modal">
        <div class="result-modal-head">
          <div class="badges">
            <span class="result-badge">${sectionInfo.label}</span>
          </div>
          <button class="result-modal-close" onclick="closeResultModal()" aria-label="닫기">✕</button>
        </div>
        <div class="result-modal-body">${bodyHtml}</div>
      </div>
    </div>
  `;
}

function formatDate(iso){
  if(!iso) return '아직 업데이트되지 않음';
  const d = new Date(iso);
  return `마지막 업데이트 ${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

function setTab(id){
  state.activeTab = id;
  renderDynamic();
}

// The header + search bar are written to the DOM exactly once (renderShell).
// After that, only #dynamic-area is ever touched, so the search <input>
// element itself is never re-created — this is what keeps Korean (and other
// IME) composition working correctly while typing.
function renderShell(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div>
        <p class="brand-title">간호 포켓북</p>
        <p class="brand-sub">8병동 · 신규간호사 참고자료</p>
      </div>
    </header>
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B3ABAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="내용 검색 (예: 낙상, PCA, 금식)" oninput="onSearchInput(this.value)">
      <button id="search-clear-btn" class="search-clear" style="display:none" onclick="clearSearch()" aria-label="검색어 지우기">✕</button>
    </div>
    <div id="dynamic-area"></div>
  `;
}

function renderDynamic(){
  const area = document.getElementById('dynamic-area');
  if(state.loading){
    area.innerHTML = `<div class="loading">불러오는 중…</div>`;
    return;
  }
  if(state.error){
    area.innerHTML = `<div class="loading">${state.error}</div>`;
    return;
  }

  const section = SECTIONS.find(s => s.id === state.activeTab);
  const data = state.content[state.activeTab] || {body:'', updatedAt:null};

  let html = '';
  const isSearching = state.searchQuery.trim();

  if(isSearching){
    const results = searchManual(state.searchQuery);
    const q = state.searchQuery.trim();
    if(results.length === 0){
      html += `<div class="results-empty">'${escapeHtml(q)}'에 대한 검색 결과가 없습니다.</div>`;
    } else {
      html += `<div class="results-list">` + results.map(r => {
        const plain = snippetPlain(r.text);
        const highlighted = highlightMatch(plain, q);
        const headingPart = (r.heading && r.text !== r.heading) ? `<span class="result-heading">${r.heading}</span>` : '';
        return `
          <div class="result-item" onclick="openResultModal('${r.sectionId}','${r.targetId}')">
            <div class="result-top">
              <span class="result-badge">${r.sectionLabel}</span>
              ${headingPart}
            </div>
            <p class="result-snippet">${highlighted}</p>
          </div>
        `;
      }).join('') + `</div>`;
    }
  } else {
    html += `<div class="tabs">`;
    SECTIONS.forEach(s => {
      html += `
        <div class="tab ${s.id===state.activeTab?'active':''}" onclick="setTab('${s.id}')">
          <span class="num">${s.num}</span>
          <span class="lbl">${s.label}</span>
        </div>
      `;
    });
    html += `</div>`;

    html += `<div class="card">`;
    html += `<p class="card-title">${section.full}</p>`;
    html += `<p class="updated">${formatDate(data.updatedAt)}</p>`;

    const rendered = renderSectionHtml(state.activeTab, data.body);
    html += `<div class="body-text">${rendered || '<p class="empty-state">아직 등록된 내용이 없습니다.</p>'}</div>`;

    html += `</div>`; // card
  }

  html += renderModalHtml();

  area.innerHTML = html;
}

init();
</script>
